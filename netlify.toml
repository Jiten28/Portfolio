[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Revalidate the single replaceable resume file after future deployments.
[[headers]]
  for = "/Jiten_Kumar_CV.pdf"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
